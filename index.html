<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>졸업가심사 관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;800&display=swap">
<style>
/* Layout: 공문서 양식을 그대로 옮긴 표(종이) + 오른쪽(넓은 화면) 또는 아래(좁은 화면)에 실시간 진단 결과 */
:root{
  --bg:#EDF0F4; --paper:#FFFFFF; --ink:#18202B; --muted:#5A6576; --rule:#8C97A6; --rule-soft:#C9D0DA;
  --head:#E3E9F0; --head-strong:#D3DCE7; --accent:#23507A; --accent-soft:#DCE7F2; --xline:#C2413A;
  --ok:#1D7A4E; --ok-soft:#E1F2E8; --bad:#B3261E; --bad-soft:#FBE4E2; --warn:#9A5C00; --warn-soft:#FBEFD9;
  --font-display:"Noto Serif KR","Batang",serif;
  --font-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --paper:#1A2029; --ink:#E5E9EF; --muted:#9AA5B4; --rule:#556175; --rule-soft:#333D4B;
  --head:#232C38; --head-strong:#2B3644; --accent:#8DB7E0; --accent-soft:#22344A; --xline:#EF7A72;
  --ok:#5CC48E; --ok-soft:#173327; --bad:#F08A82; --bad-soft:#3A1F1E; --warn:#E3B04B; --warn-soft:#3A2E16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --paper:#1A2029; --ink:#E5E9EF; --muted:#9AA5B4; --rule:#556175; --rule-soft:#333D4B;
  --head:#232C38; --head-strong:#2B3644; --accent:#8DB7E0; --accent-soft:#22344A; --xline:#EF7A72;
  --ok:#5CC48E; --ok-soft:#173327; --bad:#F08A82; --bad-soft:#3A1F1E; --warn:#E3B04B; --warn-soft:#3A2E16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55}
.wrap{max-width:1500px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{font-family:var(--font-display);font-size:26px;font-weight:800;margin:2px 0 0;text-wrap:balance;letter-spacing:-.01em}
.student{display:flex;flex-wrap:wrap;gap:8px}
.student label{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--rule-soft);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted)}
.student input{border:0;background:transparent;color:var(--ink);font:inherit;width:9em;padding:2px 0;outline:none}
.student label:focus-within{border-color:var(--accent)}

/* 전공 탭 */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--ink);scrollbar-width:thin}
.tab{flex:0 0 auto;font:inherit;font-weight:600;font-size:14px;border:1px solid var(--rule-soft);border-bottom:0;background:var(--head);color:var(--muted);padding:9px 14px;border-radius:6px 6px 0 0;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.trackbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 0 4px}
.trackbar .lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--ink);padding:6px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.cert-tag{font-size:13px;color:var(--muted)}
.cert-tag b{color:var(--ink)}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:12px}
@media (min-width:1360px){.layout{grid-template-columns:minmax(0,1fr) 340px}.aside{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 24px);overflow:auto}#chip{display:none}}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}

/* 종이 양식 */
.sheet{background:var(--paper);border:1px solid var(--rule-soft);border-radius:4px;padding:22px 22px 18px;min-width:0}
.sheet-title{text-align:center;margin:0 0 4px}
.stu-wrap{display:flex;justify-content:flex-end;margin-bottom:6px;overflow-x:auto}
table.form.stu{width:auto;font-size:13px}
table.form.stu th{width:4em;white-space:nowrap}
table.form.stu td{width:9.5em}
@media (max-width:480px){table.form.stu td{width:7em}}
.sheet-title .sub{display:block;font-size:13px;color:var(--muted);font-weight:500}
.sheet-title h2{font-family:var(--font-display);font-size:20px;font-weight:800;margin:2px 0 14px;letter-spacing:-.01em}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.form{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.form th,table.form td{border:1px solid var(--rule);padding:5px 6px;vertical-align:middle}
table.form th{background:var(--head);font-weight:600;text-align:center;line-height:1.35}
table.form th.grp{background:var(--head-strong)}
table.form th small,table.form td small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
table.form td.c{text-align:center}
table.form th.l, table.form td.l{text-align:left}
.grad{min-width:1020px}
.grad td.entry{vertical-align:top;padding:6px;min-width:140px}
.cert{min-width:1040px}
.c1{min-width:560px}

input.cell{width:100%;min-width:0;border:0;border-bottom:1px dashed var(--rule-soft);background:transparent;color:var(--ink);font:inherit;padding:3px 2px;outline:none}
input.cell:focus{border-bottom:1.5px solid var(--accent);background:var(--accent-soft)}
input.cell::placeholder{color:var(--muted);opacity:.6}
select.cell{width:100%;min-width:0;border:0;border-bottom:1px dashed var(--rule-soft);background:transparent;color:var(--ink);font:inherit;padding:3px 0;cursor:pointer;outline:none}
select.cell:focus{border-bottom:1.5px solid var(--accent);background:var(--accent-soft)}
select.cell option{background:var(--paper);color:var(--ink)}
input.cell[hidden]{display:none}
table.form td.blank{background:var(--bg)}
.x select.cell{opacity:.35}
input.num{text-align:center}

/* □ 체크박스 (양식의 ㅁ칸) */
.box{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;padding:2px 2px;font-weight:500}
.box input{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid var(--ink);border-radius:2px;margin:0;display:grid;place-content:center;background:var(--paper);cursor:pointer;flex:0 0 auto}
.box input::after{content:"";width:9px;height:5px;border-left:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.box input:checked{background:var(--accent);border-color:var(--accent)}
.box input:checked::after{opacity:1}
.box input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.box input:disabled{opacity:.4;cursor:default}
.boxes{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center}
.boxes.col{flex-direction:column;align-items:flex-start;gap:6px}

/* 과목 입력 리스트 */
.clist{display:flex;flex-direction:column;gap:4px}
.crow{display:flex;gap:4px;align-items:center}
.crow input.n{flex:1 1 auto}
.crow input.cr{flex:0 0 3.2em;text-align:center}
.del{flex:0 0 auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:4px}
.del:hover{color:var(--bad);background:var(--bad-soft)}
.add{margin-top:4px;font:inherit;font-size:12px;font-weight:600;color:var(--accent);background:transparent;border:1px dashed var(--accent);border-radius:4px;padding:3px 6px;cursor:pointer;width:100%}
.add:hover{background:var(--accent-soft)}
.sub-total{margin-top:6px;font-size:12px;font-weight:600;padding-top:4px;border-top:1px solid var(--rule-soft);display:flex;justify-content:space-between;gap:6px}
.sum-big{font-size:16px;font-weight:700;display:block;text-align:center}
.out{font-weight:700}
.out.ok{color:var(--ok)} .out.bad{color:var(--bad)} .out.warn{color:var(--warn)}

/* 크로스(대각선) 표시: 면제/해당 없음 */
.x{background-image:
  linear-gradient(to top right,transparent calc(50% - .8px),var(--xline) calc(50% - .8px),var(--xline) calc(50% + .8px),transparent calc(50% + .8px)),
  linear-gradient(to bottom right,transparent calc(50% - .8px),var(--xline) calc(50% - .8px),var(--xline) calc(50% + .8px),transparent calc(50% + .8px)) !important}
.x input.cell,.x .clist,.x .add,.x .boxes,.x .sub-total{opacity:.35}
.x-note{display:none;font-size:11px;font-weight:700;color:var(--xline)}
.x .x-note{display:block}

.notes{margin:12px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.notes b{color:var(--ink);font-weight:600}
.notice{background:var(--accent-soft);border-radius:6px;padding:10px 14px;font-size:13px}
.ref{margin-top:14px}
.ref summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
.ref table{margin-top:8px}

/* 결과 */
.aside{min-width:0}
.result{background:var(--paper);border:1px solid var(--rule-soft);border-radius:4px;overflow:hidden}
.verdict{padding:16px 18px;border-bottom:1px solid var(--rule-soft)}
.verdict .v-title{font-family:var(--font-display);font-size:18px;font-weight:800;margin:2px 0 2px}
.verdict.ok{background:var(--ok-soft)} .verdict.ok .v-title{color:var(--ok)}
.verdict.bad{background:var(--bad-soft)} .verdict.bad .v-title{color:var(--bad)}
.verdict.warn{background:var(--warn-soft)} .verdict.warn .v-title{color:var(--warn)}
.verdict p{margin:0;font-size:13px;color:var(--muted)}
.counts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)}
.rgroup{padding:12px 18px 14px;border-bottom:1px solid var(--rule-soft)}
.rgroup:last-child{border-bottom:0}
.rgroup h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.ritems{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ritem{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;font-size:13px}
.ico{width:20px;height:20px;border-radius:50%;display:grid;place-content:center;font-size:12px;font-weight:800;color:var(--paper);margin-top:1px}
.ico.ok{background:var(--ok)} .ico.bad{background:var(--bad)} .ico.warn{background:var(--warn)} .ico.info{background:var(--rule)}
.ritem .t{font-weight:600}
.ritem .d{display:block;color:var(--muted);font-size:12.5px}
.ritem.bad .d{color:var(--bad)}
.ritem.warn .d{color:var(--warn)}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--rule-soft);align-items:center}
.btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:5px 10px;cursor:pointer}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--paper)}
.saved{font-size:11.5px;color:var(--muted)}

#chip{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:13px;border-radius:999px;padding:9px 14px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--ink);color:var(--paper)}
#chip .dot{width:9px;height:9px;border-radius:50%}
@media (prefers-reduced-motion:no-preference){.result,.out{transition:color .15s}}

/* 결과 숨기기 */
.verdict{position:relative}
.hide-btn{position:absolute;top:12px;right:14px;font-size:12px;padding:3px 8px}
.verdict .eyebrow{padding-right:90px}
.layout.noresult{grid-template-columns:minmax(0,1fr) !important}
#chip.force{display:flex !important}

/* 학년도·학기 선택 */
.term input{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--rule-soft);border-radius:5px;padding:3px 6px;width:4.6em;text-align:center}
.term input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.term .sfx{font-size:13px;font-weight:600;margin-right:4px}
.term{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.term select{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--rule-soft);border-radius:5px;padding:3px 6px;cursor:pointer}
.term select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.backup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.backup .hint{font-size:11.5px;color:var(--muted)}

/* 직원용: 원생 시트 탭 (엑셀 시트처럼) */
.sheetbar{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;margin-top:10px;border-bottom:1px solid var(--rule);scrollbar-width:thin}
.sheetbar .lbl{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;padding:0 10px 7px 0}
.stab{flex:0 0 auto;display:flex;align-items:center;gap:4px;font:inherit;font-size:13px;background:var(--head);color:var(--muted);border:1px solid var(--rule-soft);border-bottom:0;border-radius:5px 5px 0 0;padding:5px 10px;cursor:pointer;max-width:16em}
.stab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stab[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700;border-color:var(--rule);position:relative;top:1px}
.stab:focus-visible,.sadd:focus-visible,.sact:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stab input{font:inherit;font-size:13px;width:10em;border:1px solid var(--accent);border-radius:3px;padding:1px 4px;background:var(--paper);color:var(--ink)}
.sact{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:1px 4px;border-radius:3px}
.sact:hover{background:var(--accent-soft);color:var(--ink)}
.sact.del:hover{background:var(--bad-soft);color:var(--bad)}
.sact.armed{background:var(--bad);color:var(--paper)}
.sadd{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:transparent;border:1px dashed var(--accent);border-bottom:0;border-radius:5px 5px 0 0;padding:5px 10px;cursor:pointer;margin-left:4px}
.sadd:hover{background:var(--accent-soft)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="term">
        <label class="sr" for="term-year">학년도</label><input id="term-year" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="2026"><span class="sfx">학년도</span>
        <label class="sr" for="term-sem">학기</label><select id="term-sem"><option value="1">1학기</option><option value="2">2학기</option></select>
        <span class="eyebrow">· 교육대학원</span>
      </div>
      <h1 id="page-title">졸업 가심사 자가확인</h1>
    </div>
    <div class="backup" id="backup"></div>
  </header>

  <nav class="tabs" role="tablist" id="tabs" aria-label="전공"></nav>
  <div class="trackbar" id="trackbar"></div>
  <div class="sheetbar" id="sheetbar" hidden></div>

  <div class="layout">
    <div class="main" id="form"></div>
    <aside class="aside" id="result" aria-live="polite"></aside>
  </div>
</div>
<a id="chip" href="#result"><span class="dot"></span><span id="chip-t">결과 보기</span></a>
<datalist id="dl-basic"></datalist>

<script>
(function(){
/* 'student' = 학생 배부용, 'staff' = 교학행정실 관리용 (원생별 시트 + 백업) */
const MODE = 'staff';
const STAFF = MODE === 'staff';
const TRACK ={pre:'교원양성', minor:'부전공', re:'재교육'};
const MAJORS = [
  {id:'lifelong', name:'평생교육', tracks:['re'], edu:false},
  {id:'ai', name:'AI창의융합교육', tracks:['re'], edu:false},
  {id:'counsel', name:'상담심리', tracks:['pre'], edu:false, noEduArea:true, ref:'counsel'},
  {id:'career', name:'진로진학상담', tracks:['minor'], edu:true, eduCr:2, ref:'career', cert:'중등학교정교사(2급) 진로진학상담'},
  {id:'early', name:'유아교육', tracks:['pre','re'], edu:true, eduCr:2, ref:'early', cert:'유치원정교사(2급)'},
  {id:'kor', name:'국어교육', tracks:['pre','re'], edu:true, eduCr:3, ref:'kor', cert:'중등학교정교사(2급) 국어',
    preset:['국어교육론'],
    pick:{1:['(2) 중 택1',['국어학개론','국어문법론','국어사']], 2:['(3) 중 택1',['국문학개론','국문학사']],
      3:['(4) 중 택1',['문학교육론','소설교육론','시가교육론','희곡교육론','수필교육론']], 4:['(5) 중 택1',['의사소통교육론','표현교육론','이해교육론']]}},
  {id:'eng', name:'영어교육', tracks:['pre','re'], edu:true, eduCr:3, ref:'eng', cert:'중등학교정교사(2급) 영어'},
  {id:'math', name:'수학교육', tracks:['pre','re'], edu:true, eduCr:3, ref:'math', cert:'중등학교정교사(2급) 수학'},
  {id:'nutri', name:'영양교육', tracks:['pre','re'], edu:false, noEduArea:true, ref:'nutri', cert:'영양교사(2급)',
    preset:['영양교육및상담실습','영양학','생애주기영양학','단체급식및실습','식품위생학'],
    pick:{5:['(4) 중 택1',['영양판정및실습','식사요법및실습']], 6:['(5) 중 택1',['식품학','조리원리및실습']]}},
  {id:'pe', name:'체육교육', tracks:['pre','re'], edu:true, eduCr:3, ref:'pe', cert:'중등학교정교사(2급) 체육'}
];
const REF = {
  kor:{title:'국어<br><small>Korean Language</small>', dept:'국어교육, 국어국문학 및 관련되는 학부(전공·학과)',

function major(){ return MAJORS.find(m => m.id === store.cur.major) || MAJORS[0]; }
function cfg(){
  const m = major();
  if (!m.tracks.includes(store.cur.track)) store.cur.track = m.tracks[0];
  const track = store.cur.track;
  const c1 = m.id === 'counsel' && track === 'pre' && store.cur.level === '1';
  const certTitle = m.id === 'counsel' ? `전문상담교사(${c1 ? '1' : '2'}급)` : m.cert;

}

function newSheet(g, c){ g.seq = (g.seq || 0) + 1; return {label:`시트 ${g.seq}`, custom:false, student:{name:'', id:'', year:''}, data:fresh(c)}; }
function group(){
  const c = cfg();
  let g = store.sheets[c.key];
  if (!g || !g.list || !g.list.length) { g = store.sheets[c.key] = {list:[], active:0, seq:0}; g.list.push(newSheet(g, c)); }
  if (g.active >= g.list.length) g.active = g.list.length - 1;
  return g;
}
function sheet(){ const g = group(); return g.list[g.active]; }
function sheetName(sh){
  if (sh.custom) return sh.label;

}

  if (STAFF) return sheet().data;

const inp = (path, val, ph='', cls='') => `<input class="cell ${cls}" id="f-${path.replace(/\./g,'-')}" data-path="${path}" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off"${cls.includes('num')?' inputmode="decimal"':''}>`;
const box = (path, label, opts={}) => {
  const id = 'f-' + path.replace(/\./g,'-') + (opts.val ? '-'+opts.val : '') + (opts.count ? '-c'+opts.count : '');
  const attrs = opts.val != null ? `data-group="1" data-val="${opts.val}"` : opts.count ? `data-count="${opts.count}"` : '';
  return `<label class="box" for="${id}"><input type="checkbox" id="${id}" data-path="${path}" ${attrs} ${opts.checked?'checked':''}>${label}</label>`;
};

}

      <th colspan="2" data-x="tres">논문 / 연구보고서</th>
      <td colspan="2" class="c" data-x="tres"><div class="boxes">${box('tres','합격',{val:'pass',checked:s.tres==='pass'})}${box('tres','불합격',{val:'fail',checked:s.tres==='fail'})}</div></td></tr>
  </table></div>
  <ul class="notes">
    <li>※ 전공과목 중 <b>교과교육학</b> 과목은 6학점 이상(2과목 이상)을 이수하여야 한다. (진로진학상담·유아교육·국어교육·영어교육·수학교육·체육교육전공에 해당)</li>
    <li>※ 위에 해당하지 않는 전공은 전공과목을 <b>교과내용학 과목만으로</b> 이수하여야 한다.</li>
    <li>※ 전공과목: 성적표 상 <b>전선</b>으로 표기된 과목 (추필과목 제외)${c.edu ? ' · 교과교육학: 전선과목 중 「교」로 표기된 과목 · 교과내용학: 교과교육학을 제외한 전선과목' : ''}</li>
    <li>※ 교직과목: 성적표 상 <b>교직</b>으로 표기된 과목 (교선과목 제외)</li>
    ${c.minor ? '<li>※ 「교원자격검정령」에 의한 부전공 교원자격 취득을 하려는 사람은 교직과목을 전공과목으로 대체 이수할 수 있다.</li>' : ''}
    <li>※ 학위취득방법은 위 표의 □에서 하나만 선택하세요. 논문/연구보고서는 논문·보고서지도 Ⅰ(3차수)·Ⅱ(4차수)·Ⅲ(5차수), 학위논문대체는 마지막 차수에 추가학점 6학점을 수강신청합니다.</li>
  </ul>
  </section>`;
}

function teachRow(id, name, s){
  const r = s.rows[id];
  return `<td class="l">${name}</td><td>${inp(`rows.${id}.sem`, r.sem, '예: 2025-1')}</td><td>${inp(`rows.${id}.grade`, r.grade)}</td>`;
}
function certRow(id, name, s){
  const r = s.rows[id];
  return `<td class="l">${name}</td><td>${inp(`rows.${id}.sem`, r.sem, '예: 2025-1')}</td><td>${inp(`rows.${id}.grade`, r.grade)}</td><td>${inp(`rows.${id}.cr`, r.cr, '학점', 'num')}</td>`;
}
function selectCell(path, val, ph, options, etc){
  return `<select class="cell sel" id="f-${path.replace(/\./g,'-')}" data-path="${path}"><option value="">${esc(ph)}</option>${options.map(o =>
    `<option value="${esc(o)}"${o===val?' selected':''}>${esc(o)}</option>`).join('')}${etc ? `<option value="__etc"${val==='__etc'?' selected':''}>기본이수 외 과목(직접 입력)</option>` : ''}</select>`;
}
function basicRow(i, s, m){
  const b = s.basic[i];
  let name;
  if (m.preset && i < m.preset.length) name = `<span>${esc(m.preset[i])}</span>`;
  else if (m.pick && m.pick[i]) name = selectCell(`basic.${i}.n`, b.n, `— ${m.pick[i][0]} —`, m.pick[i][1]);
  else name = `<input class="cell" id="f-basic-${i}-n" data-path="basic.${i}.n" value="${esc(b.n)}" placeholder="과목명" list="dl-basic" autocomplete="off">`;
  return `<td class="l"><div class="crow"><span style="flex:0 0 auto">${i+1}.</span>${name}</div></td><td>${inp(`basic.${i}.sem`, b.sem, '예: 2025-1')}</td><td>${inp(`basic.${i}.grade`, b.grade)}</td><td>${inp(`basic.${i}.cr`, b.cr, '학점', 'num')}</td>`;
}
function minorRow(k, s){
  const r = s.minor.rows[k];
  return `<td class="l"><div class="crow"><span style="flex:0 0 auto">${k+1}.</span>${selectCell(`minor.rows.${k}.pick`, r.pick, '— 과목 선택 —', REF.career.names, true)}</div>
    <input class="cell" id="f-minor-${k}-n" data-path="minor.rows.${k}.n" value="${esc(r.n)}" placeholder="과목명 입력" autocomplete="off"${r.pick==='__etc'?'':' hidden'}></td>
    <td>${inp(`minor.rows.${k}.sem`, r.sem, '예: 2025-1')}</td><td>${inp(`minor.rows.${k}.grade`, r.grade)}</td><td>${inp(`minor.rows.${k}.cr`, r.cr, '학점', 'num')}</td>`;
}
function reqCells(k, s, labelCols, rowspan){
  const rs = rowspan ? ` rowspan="${rowspan}"` : '';
  const label = REQ_EDU.find(r=>r[0]===k)[1];
  return `<th colspan="${labelCols}"${rs}>${label} 2회 이상</th><td class="c"${rs}>${box(`req.${k}`,'1회',{count:1,checked:s.req[k]>=1})}</td><td class="c"${rs}>${box(`req.${k}`,'2회',{count:2,checked:s.req[k]>=2})}</td>`;
}

function teachLeft(s, minor){
  const L = {};
  L[2] = `<th class="grp" rowspan="9">교직이론<small>12학점 이상<br>(6과목 이상)</small></th>` + teachRow('t0', THEORY[0], s);
  for (let i=1;i<9;i++) L[2+i] = teachRow('t'+i, THEORY[i], s);
  L[11] = `<th class="grp" rowspan="4">교직소양<small>6학점 이상<br>(4과목 이상)<br>전 과목 필수<br>※ 디지털교육은 2024학년도 입학자부터</small></th>` + teachRow('s0', LITERACY[0], s);
  for (let i=1;i<3;i++) L[11+i] = teachRow('s'+i, LITERACY[i], s);
  L[14] = teachRow('s3', `${LITERACY[3]}<span class="x-note">2023학년도 이전 입학 · 해당 없음</span>`, s).replace(/<td/g, '<td data-x="dig"');
  L[15] = `<th class="grp" rowspan="2" data-x="pall">교육실습<small>4학점 이상<br>(2과목 이상)</small></th>` + teachRow('p0', PRACTICE[0], s).replace(/<td/g, '<td data-x="pall pfield"');
  L[16] = teachRow('p1', PRACTICE[1], s).replace(/<td/g, '<td data-x="pall"');
  L[20] = `<th class="grp">교직과목 합계<small data-out="teach-need">(22학점 이상)</small></th><td>${inp('teachTotal', s.teachTotal, '학점', 'num')}</td><th>교직과목 평균성적<small>(80점 이상)</small></th><td>${inp('teachAvg', s.teachAvg, '', 'num')}</td>`;
  // 부전공: 교직과목 전체 면제(현직교원) → 모든 칸에 크로스
  if (minor) for (const i in L) L[i] = L[i].replace(/ data-x="[^"]*"/g, '').replace(/<(td|th)/g, '<$1 data-x="tx"');
  L[17] = minor
    ? `<th class="grp" rowspan="3">교 직<br>면제사항</th><td colspan="3" rowspan="3" class="c"><div class="boxes"><label class="box"><input type="checkbox" checked disabled>전체면제</label><label class="box"><input type="checkbox" disabled>실습면제</label></div>
      <small style="margin-top:6px">중등학교 및 특수(중등)학교 현직교원에 한함</small></td>`
    : `<th class="grp" rowspan="3">교 직<br>면제사항</th><td colspan="3" rowspan="3" class="c"><div class="boxes">${box('exempt','전체면제',{val:'all',checked:s.exempt==='all'})}${box('exempt','실습면제',{val:'practice',checked:s.exempt==='practice'})}</div>
      <small style="margin-top:6px">전체면제: 교육실습 2과목 모두 면제 · 실습면제: 학교현장실습만 면제(교육봉사활동은 이수)</small></td>`;
  L[18] = L[19] = '';
  return L;
}
function certRight(c, s){
  const R = [], m = c.m;
  if (c.minor || !m.noEduArea) {
    R.push(`<th class="grp" rowspan="3">교과교육영역<small>6학점 이상<br>(2과목 이상)</small></th>` + certRow('e0', EDU_AREA[0], s));
    R.push(certRow('e1', EDU_AREA[1], s), certRow('e2', EDU_AREA[2], s));
  }
  if (c.minor) {
    R.push(`<th class="grp" rowspan="9">교과내용영역<small>24학점 이상<br>[※기본이수과목 14학점(5과목 이상) 포함]</small></th>` + minorRow(0, s));
    for (let k=1;k<9;k++) R.push(minorRow(k, s));
    R.push(`<th colspan="2" rowspan="3">전공과목 합계<small>(30학점 이상)</small></th><td rowspan="3" class="c">${inp('minor.total', s.minor.total, '학점', 'num')}<small data-out="major-hint"></small></td>
      <th rowspan="3">전공과목 평균성적<small>(75점 이상)</small></th><td rowspan="3">${inp('minor.avg', s.minor.avg, '', 'num')}</td>`, '', '');
  } else {
    R.push(`<th class="grp" rowspan="8">기본이수과목<small>14학점 이상<br>(5과목 이상)<br>학부 인정분 합산${m.id === 'counsel' ? '<br>※ 상담실습: 2026학년도 입학자부터 필수' : ''}</small></th>` + basicRow(0, s, m));
    for (let i=1;i<7;i++) R.push(basicRow(i, s, m));
    R.push(`<th>계 (교대원)</th><td colspan="2" class="c"><span class="out" data-out="basic-n">0과목</span></td><td class="c"><span class="out" data-out="basic-cr">0</span></td>`);
    R.push(`<th colspan="2" rowspan="2">전공학점 인정내역(학부)<small>교학행정실 기입</small></th><td colspan="3" rowspan="2">
      <div class="crow" style="max-width:10em;margin:0 auto">${inp('ug.cr', s.ug.cr, '', 'num')}<span style="flex:0 0 auto">학점</span></div></td>`, '');
    R.push(`<th rowspan="2">전공과목 합계<small>[학부+교대원]<br>(50학점 이상)</small></th><td rowspan="2" class="c">${inp('majorTotal', s.majorTotal, '학점', 'num')}<small data-out="major-hint"></small></td>
      <th colspan="2" rowspan="2">전공과목 평균성적<small>(75점 이상)</small></th><td rowspan="2">${inp('majorAvg', s.majorAvg, '', 'num')}</td>`, '');
  }
  if (R.length < 15) { const gap = 15 - R.length; R.push(`<td colspan="5" rowspan="${gap}" class="blank"></td>`); for (let i=1;i<gap;i++) R.push(''); }
  R.push(reqCells('apt', s, 3), reqCells('cpr', s, 3), reqCells('gen', s, 3, 2), '');
  return R;
}

function certSheet(c){
  const s = S();
  const L = teachLeft(s, c.minor), R = certRight(c, s);
  let rows = '';
  for (let i=2;i<=20;i++) rows += `<tr>${L[i]}${R[i-2]}</tr>`;
  if (c.minor) rows += `<tr><th>비 고</th><td colspan="8" class="l">○ 30학점 이상(표시과목 관련) — 교과내용 영역 24학점 이상 · 교과교육 영역 6학점(2과목) 이상 ※ 기본이수과목 14학점(5과목 이상) 포함</td></tr>`;
  const r = REF[c.m.ref];
  return `<section class="sheet" aria-labelledby="t-cert">
  <div class="sheet-title"><h2 id="t-cert">${c.minor ? '부전공 무시험검정 합격 기준' : `교원자격취득학점 &lt;${esc(c.certTitle)}&gt;`}</h2></div>
  <div class="scroll"><table class="form cert">
    <colgroup><col style="width:9%"><col style="width:17%"><col style="width:9%"><col style="width:7%"><col style="width:10%"><col style="width:24%"><col style="width:9%"><col style="width:7%"><col style="width:7%"></colgroup>
    <tr><th colspan="4">${c.minor ? '교직과목(면제)' : '교직과목'}</th><th colspan="5">전공과목</th></tr>
    <tr><th>구분</th><th>이수과목</th><th>학기</th><th>성적</th><th>구분</th><th>과목명</th><th>학기</th><th>성적</th><th>학점</th></tr>
    ${rows}
  </table></div>
  <ul class="notes">
    <li>※ 학기를 입력한 과목을 <b>이수한 과목</b>으로 계산합니다. 교직과목 합계, 전공과목 합계, 평균성적은 성적표를 보고 직접 입력하세요.</li>
    <li>※ 전공과목: 성적표 상 <b>전선 및 추필</b>로 표기된 과목 (추필과목 포함)</li>
    ${c.minor
      ? `<li>※ 교과교육영역: ① 국어교육을 제외한 영어·수학·체육·유아교육전공은 과목당 3학점(국어교육전공은 과목당 2학점) ② "교과" 대신 "전공명"으로 표기된 과목</li>
         <li>※ 교과내용영역의 기본이수과목은 목록에서 하나씩 선택하세요. 기본이수과목이 아닌 과목은 "기본이수 외 과목(직접 입력)"을 고르세요.</li>`
      : `<li>※ 교과교육영역: ① 국어·영어·수학·체육교육전공은 과목당 3학점(진로진학상담·유아교육 등 나머지 전공은 과목당 2학점) ② "교과" 대신 "전공명"으로 표기된 과목 (예: 수학교육 전공의 교과교육론 = 수학교육론)</li>
         <li>※ 기본이수과목: 전공학점 인정내역(학부)을 포함하여 교육대학원 이수과목과 합산 (예: 학부에서 12학점(6과목) 이수 시 교육대학원에서 2학점 이상 이수)</li>
         <li>※ 교직과목: 성적표 상 <b>교직 및 교선</b>으로 표기된 과목 (교선과목 포함)</li>`}
  </ul>
  ${r ? `<details class="ref"><summary>${c.minor ? '부전공에 의한 표시과목 취득 가능 전공' : '표시과목별 기본이수과목 보기'}</summary><div class="scroll"><table class="form" style="min-width:560px">
    <tr><th style="width:18%">표시과목</th><th style="width:22%">관련학과 또는 학부</th><th>기본이수과목(또는 분야)</th>${r.note?'<th style="width:20%">비고</th>':''}</tr>
    <tr><th>${r.title}</th><td>${r.dept}</td><td class="l">${r.items}</td>${r.note?`<td>${r.note}</td>`:''}</tr></table></div></details>` : ''}
  </section>`;
}

function c1Sheet(c){
  const s = S();
  let rows = '';
  C1_REQ.forEach((n,i) => {
    rows += `<tr>${i===0?`<th class="grp" rowspan="8">필수<small>14학점 이상<br>(7과목 이상)</small></th>`:''}<td class="l">${i+1}. ${n}</td><td>${inp(`c1.req.${i}.sem`, s.c1.req[i].sem, '예: 2025-1')}</td><td>${inp(`c1.req.${i}.cr`, s.c1.req[i].cr, '학점', 'num')}</td></tr>`;
  });
  rows += `<tr><th class="grp" rowspan="2">필수</th><td class="l" rowspan="2">상담실습 및 사례연구</td><td>사례연구·발표</td><td class="c">${box('c1.cs','이수',{checked:s.c1.cs})}</td></tr>
    <tr><td>20시간 이상 실습</td><td class="c">${box('c1.p20','이수',{checked:s.c1.p20})}</td></tr>`;
  s.c1.elect.forEach((e,i) => {
    rows += `<tr>${i===0?`<th class="grp" rowspan="4">선택<small>4학점 이상<br>(2과목 이상)</small></th>`:''}<td><div class="crow"><span style="flex:0 0 auto">${i+1}.</span>${inp(`c1.elect.${i}.n`, e.n, '과목명')}</div></td><td>${inp(`c1.elect.${i}.sem`, e.sem, '예: 2025-1')}</td><td>${inp(`c1.elect.${i}.cr`, e.cr, '학점', 'num')}</td></tr>`;
  });
  rows += `<tr><th class="grp">전공과목 합계<small>(총 20학점 이상)</small></th><td class="c"><span class="out sum-big" data-out="c1-cr">0</span><small>학점</small></td><th>전공과목 평균성적<small>(75점 이상)</small></th><td>${inp('c1.avg', s.c1.avg, '', 'num')}</td></tr>`;
  REQ_EDU.forEach(([k]) => rows += `<tr>${reqCells(k, s, 2)}</tr>`);
  return `<section class="sheet" aria-labelledby="t-c1">
    <div class="sheet-title"><h2 id="t-c1">교원자격취득학점 &lt;전문상담교사(1급)&gt;</h2></div>
    <div class="scroll"><table class="form c1">
      <colgroup><col style="width:20%"><col style="width:36%"><col style="width:22%"><col style="width:22%"></colgroup>
      <tr><th colspan="4">전공과목</th></tr><tr><th>구분</th><th>이수과목</th><th>학기</th><th>학점</th></tr>${rows}
    </table></div>
    <ul class="notes"><li>※ 학기를 입력한 과목을 이수한 과목으로 계산합니다.</li></ul>
  </section>`;
}

function render(){
  const c = cfg(); S();
  document.getElementById('tabs').innerHTML = MAJORS.map(m =>
    `<button class="tab" role="tab" type="button" id="tab-${m.id}" aria-selected="${m.id===c.m.id}" data-major="${m.id}">${m.name}</button>`).join('');
  let tb = `<span class="lbl">과정 구분</span><div class="seg" role="group" aria-label="과정 구분">${c.m.tracks.map(t =>
    `<button type="button" data-track="${t}" aria-pressed="${t===c.track}">${TRACK[t]}</button>`).join('')}</div>`;
  if (c.m.id === 'counsel' && c.track === 'pre') tb += `<span class="lbl">취득 자격</span><div class="seg" role="group" aria-label="취득 자격">
    <button type="button" data-level="2" aria-pressed="${!c.c1}">전문상담교사 2급</button><button type="button" data-level="1" aria-pressed="${c.c1}">전문상담교사 1급</button></div>`;
  if (c.cert || c.minor) tb += `<span class="cert-tag">취득가능 자격 <b>${esc(c.certTitle)}</b></span>`;
  document.getElementById('trackbar').innerHTML = tb;

  let html = '';
  if (store.example === c.key) html += `<div class="notice" style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between"><span><b>작성 예시</b>예요. 국어교육 교원양성 원생이 입력한 모습을 보여줘요. 본인 내용으로 바꾸거나 비우고 시작하세요.</span><button type="button" class="btn" id="clear-example">예시 지우고 시작</button></div>`;
  if (c.track === 're') html += `<div class="notice">재교육과정은 교원자격 취득이 불가하며, 교직과정 필수교육(교직 적성·인성검사, 응급처치·심폐소생술, 성인지 교육)은 확인하지 않아요. 아래 <b>졸업 이수학점</b>만 입력하면 됩니다.</div>`;
  if (c.track === 'minor') html += `<div class="notice">부전공은 중등학교·특수학교(중등) <b>현직 교원</b>만 지원할 수 있어 교직과목은 면제예요. 졸업 이수학점과 부전공 무시험검정 합격 기준을 입력하세요.</div>`;
  html += gradSheet(c);
  if (c.cert || c.minor) html += c.c1 ? c1Sheet(c) : certSheet(c);
  document.getElementById('form').innerHTML = html;

  const r = REF[c.m.ref];
  document.getElementById('dl-basic').innerHTML = (r && r.names ? r.names : []).map(n=>`<option value="${esc(n)}">`).join('');
  const st = STU();
  ['name','id','year'].forEach(k => document.getElementById('stu-'+k).value = st[k] || '');
  renderSheetbar();
  compute();
}

/* ---------- 직원용: 원생 시트 탭 ---------- */
let renaming = false, delArmed = false;
function renderSheetbar(){
  const bar = document.getElementById('sheetbar');
  if (!STAFF) { bar.hidden = true; return; }
  bar.hidden = false;
  const g = group();
  bar.innerHTML = `<span class="lbl">원생 시트</span>` + g.list.map((sh, i) => {
    const on = i === g.active;
    const nm = renaming && on
      ? `<input id="sheet-rename" value="${esc(sheetName(sh))}" aria-label="시트 이름">`
      : `<span class="nm">${esc(sheetName(sh))}</span>`;
    const acts = on && !renaming
      ? `<button type="button" class="sact" data-rename aria-label="시트 이름 바꾸기" title="이름 바꾸기">✎</button>${g.list.length > 1
          ? `<button type="button" class="sact del${delArmed ? ' armed' : ''}" data-sdel aria-label="시트 삭제">${delArmed ? '삭제할까요?' : '×'}</button>` : ''}`
      : '';
    return `<div class="stab" role="tab" tabindex="0" aria-selected="${on}" data-sheet="${i}" title="더블클릭하면 이름을 바꿀 수 있어요">${nm}${acts}</div>`;
  }).join('') + `<button type="button" class="sadd" id="sheet-add">+ 원생 추가</button>`;
  if (renaming) { const r = document.getElementById('sheet-rename'); r.focus(); r.select(); }
}
function commitRename(keep){
  if (!renaming) return;
  const inputEl = document.getElementById('sheet-rename');
  const v = inputEl ? inputEl.value.trim() : '';
  renaming = false;
  if (keep && v) { const sh = sheet(); sh.label = v; sh.custom = true; save(); }
  renderSheetbar();
}
function selectSheet(i){
  const g = group(); if (i === g.active) return;
  g.active = i; renaming = false; delArmed = false; armed = false; save(); render();
}
const sbar = document.getElementById('sheetbar');
sbar.addEventListener('click', e => {
  const g = group();
  if (e.target.closest('#sheet-add')) {
    g.list.push(newSheet(g, cfg())); g.active = g.list.length - 1;
    renaming = false; delArmed = false; armed = false; save(); render(); return;
  }
  if (e.target.closest('[data-rename]')) { renaming = true; renderSheetbar(); return; }
  if (e.target.closest('[data-sdel]')) {
    if (!delArmed) { delArmed = true; renderSheetbar(); setTimeout(() => { if (delArmed) { delArmed = false; renderSheetbar(); } }, 4000); return; }
    g.list.splice(g.active, 1); g.active = Math.max(0, g.active - 1); delArmed = false; save(); render(); return;
  }
  if (e.target.closest('#sheet-rename')) return;
  const t = e.target.closest('[data-sheet]'); if (t) selectSheet(+t.dataset.sheet);
});
sbar.addEventListener('dblclick', e => {
  const t = e.target.closest('[data-sheet]'); if (!t || +t.dataset.sheet !== group().active || renaming) return;
  renaming = true; renderSheetbar();
});
sbar.addEventListener('keydown', e => {
  if (e.target.id === 'sheet-rename') {
    if (e.key === 'Enter') { e.preventDefault(); commitRename(true); }
    if (e.key === 'Escape') { e.preventDefault(); commitRename(false); }
    return;
  }
  const t = e.target.closest('[data-sheet]');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectSheet(+t.dataset.sheet); }
});
sbar.addEventListener('focusout', e => { if (e.target.id === 'sheet-rename') commitRename(true); });

/* ---------- 계산 ---------- */
function compute(){
  const c = cfg(), s = S();
  const form = document.getElementById('form');
  const active = new Set();
  if (!c.edu) active.add('edu');
  if (s.method === 'extra') { active.add('thesis'); active.add('tres'); }
  if (s.method === 'thesis') active.add('extra');
  if (s.exempt === 'all') { active.add('pall'); active.add('pfield'); }
  if (s.exempt === 'practice') active.add('pfield');
  if (c.minor) active.add('tx');
  const ey = entryYear();
  const digitalExempt = ey != null && ey < 2024;
  if (digitalExempt) active.add('dig');
  form.querySelectorAll('[data-x]').forEach(el => {
    const on = el.dataset.x.split(' ').some(n => active.has(n));
    el.classList.toggle('x', on);
    el.querySelectorAll('input,button,select').forEach(i => { if (!i.closest('th')) i.disabled = on; });
  });
  form.querySelectorAll('select[data-path^="minor.rows."]').forEach(sel => {
    const k = +sel.dataset.path.split('.')[2];
    const etc = document.getElementById(`f-minor-${k}-n`); if (etc) etc.hidden = sel.value !== '__etc';
    const used = new Set(s.minor.rows.filter((r,j) => j !== k).map(r => r.pick));
    [...sel.options].forEach(o => { if (o.value && o.value !== '__etc') o.disabled = used.has(o.value); });
  });
  const out = (k, text, st) => form.querySelectorAll(`[data-out="${k}"]`).forEach(el => { el.textContent = text; el.classList.remove('ok','bad','warn'); if (st) el.classList.add(st); });

  const items = [];
  const add = (grp, st, t, d) => items.push({grp, st, t, d});
  const G = '졸업 이수학점', C = '교원자격취득학점', E = '교직과정 필수교육';

  const L = k => { const a = (s.lists[k]||[]).filter(e => filled(e.n) || num(e.c) > 0); return {cr: a.reduce((x,e)=>x+num(e.c),0), n: a.length, noCr: a.filter(e=>num(e.c)<=0).length}; };
  const edu = c.edu ? L('edu') : {cr:0,n:0,noCr:0}, con = L('content'), teach = L('teach'), common = L('common');
  const extra = s.method === 'thesis' ? {cr:0,n:0,noCr:0} : L('extra');
  const th = s.method === 'extra' ? {cr:0,n:0} : (n => ({cr:n*2, n}))(s.thesis.filter(Boolean).length);
  const sumTxt = o => `${f(o.cr)}학점 · ${o.n}과목`;
  out('sum-edu', sumTxt(edu), c.edu ? (edu.cr>=6 && edu.n>=2 ? 'ok' : 'bad') : '');
  out('sum-content', sumTxt(con)); out('sum-teach', sumTxt(teach), teach.cr>=4 && teach.n>=2 ? 'ok' : 'bad');
  out('sum-extra', sumTxt(extra), s.method==='extra' ? (extra.cr>=6 && extra.n>=2 ? 'ok':'bad') : '');
  out('sum-thesis', sumTxt(th), s.method==='thesis' ? (th.n===3 ? 'ok':'bad') : '');
  out('sum-common', sumTxt(common));
  const majCr = edu.cr + con.cr, majN = edu.n + con.n;
  const tot = {cr: majCr + teach.cr + th.cr + extra.cr + common.cr, n: majN + teach.n + th.n + extra.n + common.n};
  out('total-cr', `${f(tot.cr)}학점`, tot.cr>=30 ? 'ok':'bad'); out('total-n', `${tot.n}과목`, tot.n>=11 ? 'ok':'bad');

  const need = (cr, n, rc, rn) => { const p = []; if (cr < rc) p.push(`${f(rc-cr)}학점`); if (n < rn) p.push(`${rn-n}과목`); return p.length ? `${p.join(' · ')} 더 필요` : ''; };
  let m = need(majCr, majN, 14, 6);
  add(G, m?'bad':'ok', '전공과목 14학점(6과목) 이상', `${f(majCr)}학점 · ${majN}과목${m ? ' — '+m : ''}`);
  if (c.edu) { m = need(edu.cr, edu.n, 6, 2); add(G, m?'bad':'ok', '교과교육학 6학점(2과목) 이상', `${f(edu.cr)}학점 · ${edu.n}과목${m?' — '+m:''}`); }
  m = need(teach.cr, teach.n, 4, 2);
  add(G, m ? (c.minor ? 'warn' : 'bad') : 'ok', '교직과목 4학점(2과목) 이상', `${f(teach.cr)}학점 · ${teach.n}과목${m ? ' — '+m+(c.minor ? ' (부전공 교원자격 취득 시 전공과목으로 대체 이수 가능)' : '') : ''}`);
  if (!s.method) add(G, 'bad', '학위취득방법', '논문/연구보고서 또는 학위논문대체학점 중 하나를 선택하세요');
  else if (s.method === 'thesis') {
    const miss = ['Ⅰ','Ⅱ','Ⅲ'].filter((x,i)=>!s.thesis[i]);
    add(G, miss.length?'bad':'ok', '논문·보고서지도 Ⅰ,Ⅱ,Ⅲ (6학점)', miss.length ? `논문·보고서지도 ${miss.join(', ')} 미이수` : '6학점 · 3과목');
  } else { m = need(extra.cr, extra.n, 6, 2); add(G, m?'bad':'ok', '추가학점 6학점(2과목) 이상', `${f(extra.cr)}학점 · ${extra.n}과목${m?' — '+m:''}`); }
  m = need(tot.cr, tot.n, 30, 11);
  add(G, m?'bad':'ok', '총 30학점(11과목) 이상', `${f(tot.cr)}학점 · ${tot.n}과목${m?' — '+m:''}`);
  const noCr = edu.noCr + con.noCr + teach.noCr + extra.noCr + common.noCr;
  if (noCr) add(G, 'warn', '학점 미입력 과목', `과목명만 있고 학점이 비어 있는 과목이 ${noCr}개 있어요`);
  if (s.exam === 'pass') add(G, 'ok', '종합시험', '합격');
  else if (s.exam === 'fail') add(G, 'bad', '종합시험', '불합격 — 재응시가 필요해요 (추가학점이수 신청자는 6차학기 재수)');
  else if (s.exam === 'none') add(G, 'warn', '종합시험', '미응시 — 4차수 종강 후 응시해야 해요 (18학점 이상, 평생교육은 16학점)');
  else add(G, 'warn', '종합시험', '합격 / 불합격 / 미응시 중 하나를 선택하세요');
  if (s.method === 'thesis') {
    if (s.tres === 'fail') add(G, 'bad', '논문 / 연구보고서 심사', '불합격');
    else if (s.tres === 'pass') add(G, 'ok', '논문 / 연구보고서 심사', '합격');
    else add(G, 'info', '논문 / 연구보고서 심사', '심사 전이면 비워 두어도 돼요');
  }

  const reqCheck = () => REQ_EDU.forEach(([k,label]) => {
    const n = s.req[k] || 0;
    add(E, n>=2?'ok':'bad', `${label} 2회 이상`, n>=2 ? '2회 이수' : `${n}회 이수 — ${2-n}회 더 필요`);
  });

  if ((c.cert && !c.c1) || c.minor) {
    const R = s.rows;
    const done = id => filled(R[id].sem) || filled(R[id].grade);
    const totalCheck = (val, min, label) => {
      const v = filled(val) ? num(val) : null;
      add(C, v==null ? 'warn' : v>=min ? 'ok' : 'bad', label, v==null ? '합계 학점을 직접 입력하세요' : `${f(v)}학점${v<min ? ` — ${f(min-v)}학점 더 필요` : ''}`);
    };
    if (c.cert) {
      const T = THEORY.filter((n,i)=>done('t'+i)).length;
      add(C, T>=6?'ok':'bad', '교직이론 12학점(6과목) 이상', `${T}과목 이수${T<6 ? ` — ${6-T}과목 더 필요` : ''}`);
      const litNeed = LITERACY.filter((n,i) => !(i === 3 && digitalExempt));
      const litMiss = LITERACY.filter((n,i) => litNeed.includes(n) && !done('s'+i));
      add(C, litMiss.length?'bad':'ok', `교직소양 ${litNeed.length}과목 모두 이수`,
        (litMiss.length ? `미이수: ${litMiss.join(', ')}` : `${litNeed.length}과목 이수`)
        + (digitalExempt ? ' (2023학년도 이전 입학 · 디지털교육 해당 없음)' : ey == null && litMiss.includes('디지털교육') ? ' — 2023학년도 이전 입학생은 입학년도를 선택하면 디지털교육이 빠져요' : ''));
      const pNeed = s.exempt==='all' ? [] : s.exempt==='practice' ? ['p1'] : ['p0','p1'];
      const pMiss = pNeed.filter(id=>!done(id)).map(id=>PRACTICE[+id[1]]);
      add(C, pMiss.length?'bad':'ok', '교육실습', s.exempt==='all' ? '전체면제' : pMiss.length ? `미이수: ${pMiss.join(', ')}${s.exempt==='practice'?' (학교현장실습 면제)':''}` : (s.exempt==='practice' ? '교육봉사활동 이수 (학교현장실습 면제)' : '학교현장실습 · 교육봉사활동 이수'));
      const exCr = s.exempt==='all' ? 4 : s.exempt==='practice' ? 2 : 0;
      const tNeed = 22 - exCr;
      out('teach-need', exCr ? `(${tNeed}학점 이상 · 면제 ${exCr}학점 차감)` : '(22학점 이상)');
      totalCheck(s.teachTotal, tNeed, `교직과목 합계 ${tNeed}학점 이상`);
    }
    const eIds = ['e0','e1','e2'].filter(done), eCr = eIds.reduce((a,id)=>a+num(R[id].cr),0);
    if (c.minor || !c.m.noEduArea) {
      m = need(eCr, eIds.length, 6, 2);
      add(C, m?'bad':'ok', '교과교육영역 6학점(2과목) 이상', `${f(eCr)}학점 · ${eIds.length}과목${m?' — '+m:''}`);
    }
    if (c.minor) {
      const rows = s.minor.rows.filter(r => r.pick && (r.pick!=='__etc' || filled(r.n)) && (filled(r.sem) || filled(r.grade)));
      const cCr = rows.reduce((a,r)=>a+num(r.cr),0);
      add(C, cCr>=24?'ok':'bad', '교과내용영역 24학점 이상', `${f(cCr)}학점 · ${rows.length}과목${cCr<24 ? ` — ${f(24-cCr)}학점 더 필요` : ''}`);
      const b = rows.filter(r=>r.pick!=='__etc'), bCr = b.reduce((a,r)=>a+num(r.cr),0);
      m = need(bCr, b.length, 14, 5);
      add(C, m?'bad':'ok', '기본이수과목 14학점(5과목) 이상', `${f(bCr)}학점 · ${b.length}과목${m?' — '+m:''}`);
      out('major-hint', `입력한 과목 합 ${f(eCr + cCr)}학점`);
      totalCheck(s.minor.total, 30, '전공과목 합계 30학점 이상');
      reqCheck();
      renderResult(c, items);
      return;
    }
    const bDone = s.basic.filter(b => filled(b.n) && (filled(b.sem) || filled(b.grade)));
    if (c.m.id === 'counsel') {
      const has = bDone.some(b => norm(b.n) === '상담실습');
      if (ey == null) add(C, 'info', '상담실습(기본이수) 필수 여부', '입학년도를 선택하면 확인해요 (2026학년도 입학자부터 필수)');
      else if (ey >= 2026) add(C, has?'ok':'bad', '상담실습(기본이수) 이수', has ? '이수' : '2026학년도 입학자부터 필수 — 기본이수과목 칸에 상담실습을 입력하세요');
    }
    const bCr = bDone.reduce((a,b)=>a+num(b.cr),0);
    out('basic-n', `${bDone.length}과목`); out('basic-cr', f(bCr));
    m = need(bCr, bDone.length, 14, 5);
    add(C, m?'warn':'ok', '기본이수과목 14학점(5과목) 이상', `교대원 ${f(bCr)}학점 · ${bDone.length}과목${m ? ` — 교대원 기준 ${m}. 학부에서 이수한 기본이수과목을 합해 14학점(5과목) 이상인지 확인하세요` : ''}`);
    const ref = REF[c.m.ref];
    if (ref && ref.groups) {
      const names = bDone.map(b=>norm(b.n));
      const short = ref.groups.filter(([lab,list,min]) => names.filter(n=>list.some(x=>norm(x)===n)).length < min).map(g=>g[0]);
      if (short.length) add(C, 'warn', '기본이수 분야별 이수', `교대원 입력 기준 부족한 분야: ${short.join(', ')} — 학부에서 이수했다면 해당 없음`);
      else if (bDone.length) add(C, 'ok', '기본이수 분야별 이수', ref.note);
    }
    out('major-hint', `참고: 교대원 전공 ${f(majCr)}${filled(s.ug.cr) ? ` + 학부 ${f(num(s.ug.cr))}` : ''}학점`);
    totalCheck(s.majorTotal, 50, '전공과목 합계[학부+교대원] 50학점 이상');
    reqCheck();
  }
  if (c.cert && c.c1) {
    const rq = s.c1.req.map((r,i)=>({...r, n:C1_REQ[i]})).filter(r=>filled(r.sem));
    const rqCr = rq.reduce((a,r)=>a+num(r.cr),0);
    m = need(rqCr, rq.length, 14, 7);
    add(C, m?'bad':'ok', '필수 14학점(7과목) 이상', `${f(rqCr)}학점 · ${rq.length}과목${m?' — '+m:''}`);
    const pm = [!s.c1.cs && '사례연구·발표', !s.c1.p20 && '20시간 이상 실습'].filter(Boolean);
    add(C, pm.length?'bad':'ok', '상담실습 및 사례연구', pm.length ? `미이수: ${pm.join(', ')}` : '사례연구·발표, 20시간 이상 실습 완료');
    const el = s.c1.elect.filter(e=>filled(e.n) && filled(e.sem));
    const elCr = el.reduce((a,e)=>a+num(e.cr),0);
    m = need(elCr, el.length, 4, 2);
    add(C, m?'bad':'ok', '선택 4학점(2과목) 이상', `${f(elCr)}학점 · ${el.length}과목${m?' — '+m:''}`);
    const t = rqCr + elCr;
    out('c1-cr', f(t), t>=20?'ok':'bad');
    add(C, t>=20?'ok':'bad', '전공과목 합계 20학점 이상', `${f(t)}학점${t<20?` — ${f(20-t)}학점 더 필요`:''}`);
    reqCheck();
  }
  renderResult(c, items);
}

const ICON = {ok:'✓', bad:'✕', warn:'!', info:'i'};
let armed = false;
function renderResult(c, items){
  const bad = items.filter(i=>i.st==='bad').length, warn = items.filter(i=>i.st==='warn').length, ok = items.filter(i=>i.st==='ok').length;
  const st = bad ? 'bad' : warn ? 'warn' : 'ok';
  const title = bad ? `부족한 항목 ${bad}개` : warn ? '확인이 필요한 항목이 있어요' : '졸업요건을 모두 충족해요';
  const sub = bad ? '아래 빨간 항목을 채우면 졸업요건을 충족해요.' : warn ? '입력한 내용 기준으로 부족한 학점은 없어요. 노란 항목을 확인하세요.' : '최종 판정은 교학행정실 졸업가심사 결과를 따릅니다.';
  const groups = [...new Set(items.map(i=>i.grp))];
  document.getElementById('result').innerHTML = `<div class="result">
    <div class="verdict ${st}"><button type="button" class="btn hide-btn" id="hide-result">결과 숨기기</button><div class="eyebrow">${STAFF ? esc(sheetName(sheet())) + ' · ' : ''}${esc(c.m.name)} · ${TRACK[c.track]}${c.cert||c.minor?' · '+esc(c.certTitle):''}</div>
      <div class="v-title">${title}</div><p>${sub}</p>
      <div class="counts"><span class="pill ok">충족 ${ok}</span><span class="pill bad">부족 ${bad}</span><span class="pill warn">확인 ${warn}</span></div></div>
    ${groups.map(g=>`<div class="rgroup"><h3>${g}</h3><ul class="ritems">${items.filter(i=>i.grp===g).map(i=>
      `<li class="ritem ${i.st}"><span class="ico ${i.st}" aria-label="${{ok:'충족',bad:'부족',warn:'확인 필요',info:'안내'}[i.st]}">${ICON[i.st]}</span><span><span class="t">${esc(i.t)}</span><span class="d">${esc(i.d)}</span></span></li>`).join('')}</ul></div>`).join('')}
    <div class="tools"><button type="button" class="btn danger${armed?' armed':''}" id="reset">${armed?'한 번 더 누르면 비워져요':STAFF?'이 시트 비우기':'이 양식 비우기'}</button>
      <span class="saved">${STAFF ? '이 PC 브라우저에 자동 저장 · 백업 파일도 저장해 두세요' : '입력 내용은 이 브라우저에만 저장돼요'}</span></div></div>`;
  const chip = document.getElementById('chip');
  chip.querySelector('.dot').style.background = `var(--${st})`;
  document.getElementById('chip-t').textContent = bad ? `부족 ${bad}개 · 결과 보기` : warn ? `확인 ${warn}개 · 결과 보기` : '충족 · 결과 보기';
}

/* ---------- 이벤트 ---------- */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-major]'); if (!b) return;
  store.cur.major = b.dataset.major; armed = false; save(); render();
  document.getElementById('tab-'+b.dataset.major).focus();
});
document.getElementById('tabs').addEventListener('keydown', e => {
  if (!['ArrowLeft','ArrowRight'].includes(e.key)) return;
  const i = MAJORS.findIndex(m=>m.id===store.cur.major);
  const n = MAJORS[(i + (e.key==='ArrowRight'?1:-1) + MAJORS.length) % MAJORS.length];
  store.cur.major = n.id; save(); render(); document.getElementById('tab-'+n.id).focus();
});
document.getElementById('trackbar').addEventListener('click', e => {
  const t = e.target.closest('[data-track],[data-level]'); if (!t) return;
  if (t.dataset.track) store.cur.track = t.dataset.track;
  if (t.dataset.level) store.cur.level = t.dataset.level;
  armed = false; save(); render();
});
const form = document.getElementById('form');
function commit(){ save(); compute(); }
form.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'stu-name' || t.id === 'stu-id' || t.id === 'stu-year') {
    STU()[t.id.slice(4)] = t.value;
    if (STAFF && t.id !== 'stu-year') { sheet().custom = false; renderSheetbar(); }
    save(); compute(); return;
  }
  if (t.dataset.path && t.type !== 'checkbox') { setPath(S(), t.dataset.path, t.value); commit(); }
});
form.addEventListener('change', e => {
  const t = e.target; if (t.type !== 'checkbox' || !t.dataset.path) return;
  const p = t.dataset.path, s = S();
  if (t.dataset.group) {
    const v = t.checked ? t.dataset.val : '';
    setPath(s, p, v);
    form.querySelectorAll(`input[data-path="${p}"]`).forEach(b => b.checked = b.dataset.val === v);
  } else if (t.dataset.count) {
    const n = +t.dataset.count, cur = getPath(s, p) || 0;
    const v = t.checked ? Math.max(cur, n) : n - 1;
    setPath(s, p, v);
    form.querySelectorAll(`input[data-path="${p}"]`).forEach(b => b.checked = v >= +b.dataset.count);
  } else setPath(s, p, t.checked);
  commit();
});
form.addEventListener('click', e => {
  if (e.target.closest('#clear-example')) { delete store.forms[store.example]; store.example = ''; save(); render(); return; }
  const a = e.target.closest('[data-add]'), d = e.target.closest('[data-del]');
  if (a) {
    const k = a.dataset.add; S().lists[k].push({n:'', c:''});
    rerenderList(k); commit();
    const ins = document.querySelectorAll(`#list-${k} input.n`); ins[ins.length-1]?.focus();
  }
  if (d) {
    const [k, i] = d.dataset.del.split(':'); S().lists[k].splice(+i, 1); rerenderList(k); commit();
  }
});
function rerenderList(k){
  const cell = document.getElementById('list-'+k);
  const note = cell.querySelector('.x-note');
  cell.innerHTML = (note ? note.outerHTML : '') + listInner(k);
}
/* 결과 패널 숨기기 / 다시 보기 */
function applyResultVis(){
  const hide = !!store.hideResult;
  document.querySelector('.layout').classList.toggle('noresult', hide);
  document.getElementById('result').hidden = hide;
  document.getElementById('chip').classList.toggle('force', hide);
}
document.getElementById('chip').addEventListener('click', e => {
  if (!store.hideResult) return;
  e.preventDefault(); store.hideResult = false; save(); applyResultVis();
  document.getElementById('result').scrollIntoView({block:'start'});
});
document.getElementById('result').addEventListener('click', e => {
  if (e.target.closest('#hide-result')) { store.hideResult = true; save(); applyResultVis(); return; }
  if (!e.target.closest('#reset')) return;
  if (!armed) { armed = true; compute(); setTimeout(()=>{ if (armed) { armed = false; compute(); } }, 4000); return; }
  armed = false;
  if (STAFF) { const sh = sheet(); sh.data = fresh(cfg()); sh.student = {name:'', id:'', year:''}; sh.custom = false; }
  else delete store.forms[cfg().key];
  save(); render();
});

/* ---------- 학년도·학기, 직원용 백업 ---------- */
const termYear = document.getElementById('term-year'), termSem = document.getElementById('term-sem');
function syncTerm(){ termYear.value = store.term.year; termSem.value = store.term.sem; }
syncTerm();
termYear.addEventListener('input', () => { store.term.year = termYear.value.replace(/\D/g, ''); save(); });
termSem.addEventListener('change', () => { store.term.sem = termSem.value; save(); });

if (STAFF) {
  document.getElementById('page-title').textContent = '졸업 가심사 관리';
  document.title = '졸업가심사 관리';
  const bk = document.getElementById('backup');
  bk.innerHTML = `<button type="button" class="btn" id="bk-save">백업 파일 저장</button>
    <button type="button" class="btn" id="bk-load">백업 불러오기</button>
    <input type="file" id="bk-file" accept=".json,application/json" hidden>
    <span class="hint" id="bk-msg">입력 내용은 이 PC 브라우저에 자동 저장돼요</span>`;
  const msg = t => document.getElementById('bk-msg').textContent = t;
  let loadArmed = false;
  document.getElementById('bk-save').addEventListener('click', () => {
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(store)], {type:'application/json'}));
    a.download = `졸업가심사_백업_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    msg('백업 파일을 저장했어요');
  });
  document.getElementById('bk-load').addEventListener('click', e => {
    if (!loadArmed) {
      loadArmed = true; e.target.classList.add('danger','armed'); e.target.textContent = '한 번 더 누르면 파일 선택';
      msg('불러오면 지금 입력된 내용이 백업 파일 내용으로 바뀌어요');
      setTimeout(() => { loadArmed = false; e.target.classList.remove('danger','armed'); e.target.textContent = '백업 불러오기'; }, 5000);
      return;
    }
    document.getElementById('bk-file').click();
  });
  document.getElementById('bk-file').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const obj = JSON.parse(rd.result);
        if (!obj || typeof obj.sheets !== 'object') throw new Error('형식');
        store = obj; normalize(); save(); syncTerm(); render();
        msg(`${file.name}을 불러왔어요`);
      } catch(err) { msg('졸업가심사 백업 파일이 아니라서 불러오지 못했어요'); }
      e.target.value = '';
    };
    rd.readAsText(file);
  });
}

/* 처음 여는 사람에게는 작성 예시(국어교육·교원양성)를 보여줌 */
if (!STAFF && !Object.keys(store.forms).length) {
  store.cur = {major:'kor', track:'pre', level:'2'};
  const c = cfg(), s = fresh(c);
  s.method = 'thesis'; s.thesis = [true, true, false]; s.exam = 'pass';
  s.lists.edu = [{n:'국어교육론',c:'3'},{n:'국어교재연구및지도법',c:'3'}];
  s.lists.content = [{n:'국어학개론',c:'2'},{n:'국문학사',c:'2'},{n:'현대소설론',c:'2'}];
  s.lists.teach = [{n:'교육학개론',c:'2'},{n:'교육심리',c:'2'}];
  s.lists.common = [{n:'교육연구방법론',c:'2'}];
  ['t0','t2','t3','t5','t6'].forEach((id,i)=>{ s.rows[id].sem = '2024-'+(i%2+1); s.rows[id].grade = String(88+i); });
  s.rows.s0.sem = '2025-1'; s.rows.s0.grade = '92'; s.rows.s1.sem = '2025-1'; s.rows.s1.grade = '90';
  s.rows.e0.sem = '2024-1'; s.rows.e0.grade = '91'; s.rows.e1.sem = '2024-2'; s.rows.e1.grade = '87';
  s.basic[0] = {n:'국어교육론', sem:'2024-2', grade:'85', cr:'2'}; s.basic[1] = {n:'국어학개론', sem:'2025-1', grade:'90', cr:'2'};
  s.ug = {cr:'36', basicCr:'8', basicCnt:'4'};
  s.teachTotal = '14'; s.majorTotal = '48';
  s.req = {apt:2, cpr:1, gen:2};
  store.forms[c.key] = s; store.example = c.key;
}
render();
applyResultVis();
})();
</script>
